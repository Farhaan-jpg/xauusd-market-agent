name: Scheduled Market Intelligence Cycle

on:
  schedule:
    # Run every 30 minutes during active trading days
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: xauusd-analysis-run
  cancel-in-progress: false

jobs:
  run-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Cache
        uses: actions/cache@v4
        with:
          path: data/
          key: xauusd-db-${{ github.run_id }}
          restore-keys: |
            xauusd-db-

      - name: Execute One-Shot Intelligence Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED: 'true'
        run: |
          python scripts/run_cycle.py
